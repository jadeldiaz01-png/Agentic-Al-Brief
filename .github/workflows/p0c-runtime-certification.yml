name: p0c-runtime-certification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA
        required: true
        type: string
      execution_id:
        description: Unique runtime certification execution id
        required: true
        type: string

permissions:
  contents: read

env:
  P0C_EVIDENCE_DIR: /var/lib/agentic-ai-brief/p0c-evidence

jobs:
  certify:
    runs-on: [self-hosted, linux, x64, agentic-ai-brief-runtime]
    environment: agentic-ai-brief-runtime
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact deployed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install certifier
        run: python -m pip install -e .
      - name: Require protected runtime evidence directory
        shell: bash
        run: |
          set -euo pipefail
          test -d "$P0C_EVIDENCE_DIR"
          test ! -L "$P0C_EVIDENCE_DIR"
      - name: Collect one-execution evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/collect_p0c_runtime_evidence.py \
            --evidence-dir "$P0C_EVIDENCE_DIR" \
            --expected-sha "${{ inputs.expected_sha }}" \
            --execution-id "${{ inputs.execution_id }}" \
            --output /tmp/runtime-evidence.json
      - name: Certify fail-closed runtime promotion
        shell: bash
        run: |
          set -euo pipefail
          python scripts/certify_runtime_evidence.py \
            --bundle /tmp/runtime-evidence.json \
            --expected-sha "${{ inputs.expected_sha }}" \
            --output /tmp/runtime-certificate.json
          cat /tmp/runtime-certificate.json
      - name: Remove transient bundle
        if: always()
        shell: bash
        run: |
          rm -f /tmp/runtime-evidence.json /tmp/runtime-certificate.json
