name: NVIDIA Secret Presence (PREPARE_ONLY)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character main commit SHA to inspect"
        required: true
        type: string
      confirmation:
        description: "Type CHECK_NVIDIA_SECRET_PRESENCE_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nvidia-secret-presence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  presence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: nvidia-connection-check
    steps:
      - name: Enforce manual confirmation and exact main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$ACTUAL_REF" == "refs/heads/main" ]] || { echo "MAIN_ONLY=DENY"; exit 1; }
          [[ "$CONFIRMATION" == "CHECK_NVIDIA_SECRET_PRESENCE_ONLY" ]] || { echo "CONFIRMATION=DENY"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "EXPECTED_SHA=DENY"; exit 1; }
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]] || { echo "EXACT_SHA=DENY"; exit 1; }
          echo "EXACT_SHA=PASS"

      - name: Check only protected secret presence, without contacting NVIDIA
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          # Presence-only: provider routing selection is not tested or modified.
          # The source-controlled NVIDIA lock remains true and is tested by CI.
          echo "PROVIDER_SELECTION=NOT_ATTEMPTED"
          if [[ -z "${NVIDIA_API_KEY:-}" ]]; then
            echo "NVIDIA_SECRET_PRESENT=NO"
            exit 1
          fi
          echo "NVIDIA_SECRET_PRESENT=YES"
          echo "NVIDIA_API_CONTACT=NOT_ATTEMPTED"
          echo "PRODUCTION_AUTHORIZED=false"
          echo "MAX_AUTONOMOUS_CAPITAL_USD=0"
