name: security-supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' pip-audit==2.10.0
      - run: pip-audit
      - name: Reject obvious committed secret material
        run: |
          python - <<'PY'
          from pathlib import Path
          patterns=('sk-proj-','OPENAI_API_KEY=sk-','VAULT_TOKEN=hvs.','OPENBAO_TOKEN=hvs.')
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for pat in patterns:
                  if pat in text: hits.append(f'{p}:{pat}')
          if hits:
              print('\n'.join(hits)); raise SystemExit('SECRET_SCAN=FAIL')
          print('SECRET_SCAN=PASS')
          PY
