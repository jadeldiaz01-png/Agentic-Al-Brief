name: secure-runtime-connector-preflight

on:
  workflow_dispatch:
    inputs:
      expected_context:
        description: Expected kubectl context name
        required: true
        type: string
      runtime_namespace:
        description: Runtime namespace
        required: true
        default: agentic-ai-brief-runtime
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, agentic-ai-brief-runtime]
    environment: agentic-ai-brief-runtime
    timeout-minutes: 10
    env:
      EXPECTED_KUBE_CONTEXT: ${{ inputs.expected_context }}
      RUNTIME_NAMESPACE: ${{ inputs.runtime_namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify workflow is not running from a pull request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
      - name: Run fail-closed connector preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/secure_runtime_connector_preflight.sh
