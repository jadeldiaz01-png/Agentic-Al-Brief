name: secure-runtime-connector-preflight

on:
  workflow_dispatch:
    inputs:
      expected_context:
        description: Expected kubectl context name
        required: true
        type: string
      runtime_namespace:
        description: Runtime namespace
        required: true
        default: agentic-ai-brief-runtime
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: agentic-ai-brief-runtime
    timeout-minutes: 10
    env:
      EXPECTED_KUBE_CONTEXT: ${{ inputs.expected_context }}
      RUNTIME_NAMESPACE: ${{ inputs.runtime_namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify workflow is manually dispatched
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Connect ephemeral Tailscale node with GitHub OIDC
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:agentic-ai-brief-runtime
          use-cache: "false"

      - name: Materialize least-privilege kubeconfig for this job only
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.RUNTIME_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${KUBECONFIG_B64:-}"
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/runtime-kubeconfig"
          chmod 0600 "$RUNNER_TEMP/runtime-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/runtime-kubeconfig" >> "$GITHUB_ENV"
          unset KUBECONFIG_B64

      - name: Run fail-closed connector preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/secure_runtime_connector_preflight.sh

      - name: Destroy transient kubeconfig
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KUBECONFIG:-}" ] && [ -f "$KUBECONFIG" ]; then
            shred -u "$KUBECONFIG" 2>/dev/null || rm -f "$KUBECONFIG"
          fi
