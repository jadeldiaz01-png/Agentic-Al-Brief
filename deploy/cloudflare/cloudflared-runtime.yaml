apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-runtime
  namespace: agentic-ai-brief-runtime
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-runtime
  namespace: agentic-ai-brief-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-runtime
  namespace: agentic-ai-brief-runtime
  labels:
    app.kubernetes.io/name: cloudflared-runtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-runtime
    spec:
      serviceAccountName: cloudflared-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-runtime
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /var/run/secrets/cloudflare/tunnel-token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tunnel-token
              mountPath: /var/run/secrets/cloudflare
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tunnel-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: cloudflared-runtime-token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudflared-runtime-token
  namespace: agentic-ai-brief-runtime
spec:
  provider: openbao
  parameters:
    roleName: cloudflared-runtime
    objects: |
      - objectName: "tunnel-token"
        secretPath: "kv/data/agentic-ai-brief/cloudflare-tunnel"
        secretKey: "token"
